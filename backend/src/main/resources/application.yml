spring:
  application:
    name: devmentor
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:devmentor}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:devmentor}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:devmentor}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ai:
    mode: ${AI_CLIENT_MODE:fake}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
